  <!-- a soft shine -->
  <path d="M44 84 L44 150" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.5" />
  <path d="M131 84 L131 150" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.5" />
