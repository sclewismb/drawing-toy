<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Stop the page from zooming or scrolling when little fingers pinch and drag -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Drawing Toy</title>

    <!-- Installable app: icon, name and full-screen mode on the iPad home screen -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/favicon.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Drawing Toy" />
    <meta name="theme-color" content="#bfe8ff" />
    <!-- Keep it out of search engines; it's a family app -->
    <meta name="robots" content="noindex, nofollow" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #bfe8ff;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      canvas {
        display: block;
      }

      /* Big round camera button, bottom-left. No words. */
      #camera {
        position: fixed;
        left: max(16px, env(safe-area-inset-left));
        bottom: max(16px, env(safe-area-inset-bottom));
        width: 92px;
        height: 92px;
        border-radius: 50%;
        background: #fff;
        border: 4px solid #3a3a3a;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.18);
        display: grid;
        place-items: center;
        box-sizing: border-box;
        z-index: 10;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.1s;
      }
      #camera:active {
        transform: scale(0.9);
      }
      /* The real file picker covers the whole button, invisibly, so a tap
         always reaches it (the most reliable way on iPad Safari). */
      #camera input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
      }
      #camera.busy {
        pointer-events: none;
      }
      #camera.busy svg {
        animation: wiggle 0.5s ease-in-out infinite;
      }
      #camera.nope {
        animation: shake 0.45s;
      }
      #camera,
      #camera input {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      /* Grown-up extra: hold the camera button to share the last photo. */
      #share-photo {
        position: fixed;
        left: calc(max(16px, env(safe-area-inset-left)) + 108px);
        bottom: max(16px, env(safe-area-inset-bottom));
        width: 92px;
        height: 92px;
        padding: 0;
        border-radius: 20px;
        border: 4px solid #3a3a3a;
        background: #fff;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.18);
        overflow: hidden;
        z-index: 10;
        display: none;
        -webkit-tap-highlight-color: transparent;
      }
      #share-photo.show {
        display: block;
        animation: pop 0.25s ease-out;
      }
      #share-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      #share-photo svg {
        position: absolute;
        right: 4px;
        bottom: 4px;
        background: #4ea8ff;
        border-radius: 10px;
        padding: 4px;
      }
      @keyframes pop {
        from { transform: scale(0.3); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      @keyframes wiggle {
        0%, 100% { transform: rotate(-12deg) scale(1.05); }
        50% { transform: rotate(12deg) scale(0.95); }
      }
      @keyframes shake {
        0%, 100% { translate: 0; }
        20%, 60% { translate: -10px; }
        40%, 80% { translate: 10px; }
      }
    </style>
  </head>
  <body>
    <label id="camera" aria-label="Add a drawing">
      <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true">
        <path d="M21 19 L25 10 H39 L43 19" fill="#ff7a59" stroke="#3a3a3a" stroke-width="4" stroke-linejoin="round" />
        <rect x="5" y="18" width="54" height="38" rx="9" fill="#ff7a59" stroke="#3a3a3a" stroke-width="4" />
        <circle cx="32" cy="37" r="12" fill="#bfe8ff" stroke="#3a3a3a" stroke-width="4" />
        <circle cx="28" cy="33" r="3.5" fill="#fff" />
        <circle cx="50" cy="26" r="3" fill="#ffe066" />
      </svg>
      <input type="file" accept="image/*" />
    </label>
    <button id="share-photo" type="button" aria-label="Share the last photo">
      <img alt="" />
      <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
        <path d="M12 3 V15 M7 8 L12 3 L17 8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M5 12 V20 H19 V12" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
