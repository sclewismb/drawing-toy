    <style>html,body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:#bfe8ff;height:100%;margin:0;overflow:hidden}canvas{display:block}#camera{left:max(16px, env(safe-area-inset-left));bottom:max(16px, env(safe-area-inset-bottom));box-sizing:border-box;z-index:10;-webkit-tap-highlight-color:transparent;background:#fff;border:4px solid #3a3a3a;border-radius:50%;place-items:center;width:92px;height:92px;transition:transform .1s;display:grid;position:fixed;box-shadow:0 5px #0000002e}#camera:active{transform:scale(.9)}#camera{cursor:pointer;touch-action:none}#camera input{opacity:0;pointer-events:none;width:1px;height:1px;position:absolute}#camera svg,#camera.busy{pointer-events:none}#camera.busy svg{animation:.5s ease-in-out infinite wiggle}#camera.nope{animation:.45s shake}#camera,#camera input{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}#share-photo{left:calc(max(16px, env(safe-area-inset-left)) + 108px);bottom:max(16px, env(safe-area-inset-bottom));z-index:10;-webkit-tap-highlight-color:transparent;background:#fff;border:4px solid #3a3a3a;border-radius:20px;width:92px;height:92px;padding:0;display:none;position:fixed;overflow:hidden;box-shadow:0 5px #0000002e}#share-photo.show{animation:.25s ease-out pop;display:block}#share-photo img{object-fit:cover;width:100%;height:100%;display:block}#share-photo svg{background:#4ea8ff;border-radius:10px;padding:4px;position:absolute;bottom:4px;right:4px}@keyframes pop{0%{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}@keyframes wiggle{0%,to{transform:rotate(-12deg)scale(1.05)}50%{transform:rotate(12deg)scale(.95)}}@keyframes shake{0%,to{translate:0}20%,60%{translate:-10px}40%,80%{translate:10px}}</style>
