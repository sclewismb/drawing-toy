    <style>html,body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:#bfe8ff;height:100%;margin:0;overflow:hidden}canvas{display:block}#camera{left:max(16px, env(safe-area-inset-left));bottom:max(16px, env(safe-area-inset-bottom));box-sizing:border-box;z-index:10;-webkit-tap-highlight-color:transparent;background:#fff;border:4px solid #3a3a3a;border-radius:50%;place-items:center;width:92px;height:92px;transition:transform .1s;display:grid;position:fixed;box-shadow:0 5px #0000002e}#camera:active{transform:scale(.9)}#camera{cursor:pointer;touch-action:none}#camera input{opacity:0;pointer-events:none;width:1px;height:1px;position:absolute}#camera svg,#camera.busy{pointer-events:none}#camera.busy svg{animation:.5s ease-in-out infinite wiggle}#camera.nope{animation:.45s shake}#camera,#camera input{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}#grownup{left:calc(max(16px, env(safe-area-inset-left)) + 108px);bottom:max(16px, env(safe-area-inset-bottom));z-index:10;gap:16px;display:none;position:fixed}#grownup.show{animation:.25s ease-out pop;display:flex}#grownup button{-webkit-tap-highlight-color:transparent;background:#fff;border:4px solid #3a3a3a;border-radius:20px;width:92px;height:92px;padding:0;position:relative;overflow:hidden;box-shadow:0 5px #0000002e}#grownup button[hidden]{display:none}#grownup button:disabled{opacity:.5}#grownup img{object-fit:cover;width:100%;height:100%;display:block}#share-characters{background:repeating-conic-gradient(#fff 0 25%, #e6e6e6 0 50%) 0 0 / 16px 16px!important}#share-characters img{object-fit:contain;box-sizing:border-box;padding:6px}#grownup .badge{background:#4ea8ff;border-radius:10px;padding:4px;position:absolute;bottom:4px;right:4px}#grownup .count{box-sizing:border-box;color:#fff;text-align:center;background:#ff7a59;border-radius:13px;min-width:26px;height:26px;padding:0 6px;font:700 16px/26px system-ui,sans-serif;position:absolute;top:4px;left:4px}#grow   <body class="on-street">
    <label id="camera" aria-label="Add a drawing">
      <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true">
        <path d="M21 19 L25 10 H39 L43 19" fill="#ff7a59" stroke="#3a3a3a" stroke-width="4" stroke-linejoin="round" />
        <rect x="5" y="18" width="54" height="38" rx="9" fill="#ff7a59" stroke="#3a3a3a" stroke-width="4" />
        <circle cx="32" cy="37" r="12" fill="#bfe8ff" stroke="#3a3a3a" stroke-width="4" />
        <circle cx="28" cy="33" r="3.5" fill="#fff" />
        <circle cx="50" cy="26" r="3" fill="#ffe066" />
      </svg>
      <input type="file" accept="image/*" />
    </label>
    <button id="map-button" type="button" aria-label="Back">
      <svg class="to-house" viewBox="0 0 64 64" width="58" height="58" aria-hidden="true">
        <path d="M8 30 L32 10 L56 30 Z" fill="#33333b" stroke="#3a3a3a" stroke-width="3" stroke-linejoin="round" />
        <rect x="13" y="30" width="38" height="26" fill="#eadbc8" stroke="#3a3a3a" stroke-width="3" />
        <rect x="27" y="38" width="10" height="18" fill="#fff" stroke="#1f1f1f" stroke-width="3" />
        <rect x="16" y="35" width="8" height="8" fill="#f2f2f2" stroke="#1f1f1f" stroke-width="2.5" />
        <rect x="40" y="35" width="8" height="8" fill="#f2f2f2" stroke="#1f1f1f" stroke-width="2.5" />
      </svg>
      <svg class="to-street" viewBox="0 0 64 64" width="58" height="58" aria-hidden="true">
        <rect x="4" y="46" width="56" height="12" rx="3" fill="#5c5c5c" stroke="#3a3a3a" stroke-width="3" />
        <path d="M12 51 H20 M28 51 H36 M44 51 H52" stroke="#fff" stroke-width="3" stroke-linecap="round" />
        <rect x="8" y="26" width="20" height="18" fill="#ffb4a2" stroke="#3a3a3a" stroke-width="3" />
        <path d="M5 28 L18 14 L31 28 Z" fill="#e5383b" stroke="#3a3a3a" stroke-width="3" stroke-linejoin="round" />
        <rect x="34" y="20" width="24" height="24" fill="#4e7ac7" stroke="#3a3a3a" stroke-width="3" />
        <rect x="31" y="15" width="30" height="7" rx="2" fill="#2b4c8c" stroke="#3a3a3a" stroke-width="3" />
        <rect x="42" y="32" width="8" height="12" fill="#2b4c8c" stroke="#3a3a3a" stroke-width="2.5" />
      </svg>
    </button>
    <dialog id="house-settings">
      <form method="dialog">
        <h2>Our house</h2>
        <p>For grown-ups. These words are saved on this iPad only and never leave it.</p>
        <label for="hs-number">House number (shown on the house)</label>
        <input id="hs-number" name="number" type="text" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="For example: 12" />
        <label for="hs-a">Room with the triangle wall</label>
        <input id="hs-a" data-room="bedroom-a" type="text" maxlength="30" autocomplete="off" placeholder="Name of this bedroom" />
        <label for="hs-b">Room with the butterflies</label>
        <input id="hs-b" data-room="bedroom-b" type="text" maxlength="30" autocomplete="off" placeholder="Name of this bedroom" />
        <label for="hs-l">Lounge room</label>
        <input id="hs-l" data-room="lounge" type="text" maxlength="30" autocomplete="off" placeholder="Lounge Room" />
        <label for="hs-k">Kitchen</label>
        <input id="hs-k" data-room="kitchen" type="text" maxlength="30" autocomplete="off" placeholder="Kitchen" />
        <div class="buttons">
          <button type="button" data-cancel>Cancel</button>
          <button type="submit">Save</button>
        </div>
      </form>
    </dialog>
    <div id="seasons">
      <button type="button" data-season="spring" aria-label="Spring">
        <svg viewBox="0 0 48 48" width="46" height="46" aria-hidden="true">
          <g stroke="#3a3a3a" stroke-width="2.5">
            <circle cx="24" cy="12" r="8" fill="#ff8fb1" /><circle cx="35" cy="20" r="8" fill="#ff8fb1" />
            <circle cx="31" cy="33" r="8" fill="#ff8fb1" /><circle cx="17" cy="33" r="8" fill="#ff8fb1" />
            <circle cx="13" cy="20" r="8" fill="#ff8fb1" /><circle cx="24" cy="23" r="7" fill="#ffd93d" />
          </g>
        </svg>
      </button>
      <button type="button" data-season="summer" aria-label="Summer">
        <svg viewBox="0 0 48 48" width="46" height="46" aria-hidden="true">
          <g stroke="#3a3a3a" stroke-width="3" stroke-linecap="round">
            <path d="M24 3 V9 M24 39 V45 M3 24 H9 M39 24 H45 M9 9 L13 13 M35 35 L39 39 M39 9 L35 13 M13 35 L9 39" />
            <circle cx="24" cy="24" r="11" fill="#ffd23f" />
          </g>
        </svg>
      </button>
      <button type="button" data-season="autumn" aria-label="Autumn">
        <svg viewBox="0 0 48 48" width="46" height="46" aria-hidden="true">
          <g stroke="#3a3a3a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
            <path d="M24 4 Q40 14 38 28 Q34 40 24 42 Q14 40 10 28 Q8 14 24 4 Z" fill="#f4a261" />
            <path d="M24 10 V46 M24 22 L32 16 M24 30 L15 23" fill="none" />
          </g>
        </svg>
      </button>
      <button type="button" data-season="winter" aria-label="Winter">
        <svg viewBox="0 0 48 48" width="46" height="46" aria-hidden="true">
          <g stroke="#4ea8ff" stroke-width="3.5" stroke-linecap="round">
            <path d="M24 4 V44 M6.7 14 L41.3 34 M6.7 34 L41.3 14" />
            <path d="M18 8 L24 13 L30 8 M18 40 L24 35 L30 40 M8 22 L13 19 L10 13 M40 22 L35 19 L38 13 M8 26 L13 29 L10 35 M40 26 L35 29 L38 35" fill="none" stroke-width="2.5" />
          </g>
        </svg>
      </button>
    </div>
    <button id="toybox" type="button" aria-label="Toy box">
      <svg viewBox="0 0 64 64" width="60" height="60" aria-hidden="true">
        <!-- stars peeking out -->
        <path d="M24 14 l2.5 5 5.5 .8 -4 3.9 1 5.5 -5 -2.6 -5 2.6 1 -5.5 -4 -3.9 5.5 -.8z" fill="#ffd93d" stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" />
        <circle cx="42" cy="20" r="6" fill="#4ea8ff" stroke="#3a3a3a" stroke-width="2.5" />
        <!-- box -->
        <rect x="8" y="30" width="48" height="26" rx="5" fill="#b07de8" stroke="#3a3a3a" stroke-width="4" />
        <rect x="27" y="36" width="10" height="7" rx="2" fill="#ffd93d" stroke="#3a3a3a" stroke-width="2.5" />
        <!-- lid -->
        <g class="lid">
          <rect x="6" y="22" width="52" height="10" rx="4" fill="#ff7a59" stroke="#3a3a3a" stroke-width="4" />
        </g>
      </svg>
    </button>
    <div id="shelf" aria-label="Characters">
      <div class="row"></div>
    </div>
    <div id="grownup">
      <button id="share-photo" type="button" aria-label="Share the last photo" hidden>
        <img alt="" />
        <svg class="badge" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
          <path d="M12 3 V15 M7 8 L12 3 L17 8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M5 12 V20 H19 V12" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <button id="share-characters" type="button" aria-label="Save the characters as pictures" hidden>
        <img alt="" />
        <span class="count"></span>
        <svg class="badge" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
          <path d="M12 3 V15 M7 8 L12 3 L17 8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M5 12 V20 H19 V12" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>
  </body>
