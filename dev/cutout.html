<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cutout test bench</title>
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; background: #fafafa; color: #222; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p { margin: 4px 0 12px; color: #555; }
      .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 12px; position: sticky; top: 0; background: #fafafa; padding: 8px 0; z-index: 1; }
      .controls label { display: flex; gap: 6px; align-items: center; }
      .controls output { min-width: 3ch; font-variant-numeric: tabular-nums; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
      .row h2 { grid-column: 1 / -1; font-size: 15px; margin: 0; }
      .row h2 small { color: #666; font-weight: normal; margin-left: 8px; }
      .cell { height: 260px; display: grid; place-items: center; border-radius: 8px; overflow: hidden; }
      .cell img, .cell canvas { max-width: 100%; max-height: 100%; }
      .input { background: #ddd; }
      /* dark checkerboard: shows white halos and holes clearly */
      .output { background: repeating-conic-gradient(#555 0 25%, #6a6a6a 0 50%) 0 0 / 24px 24px; }
      .output.fail { background: #fdd; color: #a00; font-weight: bold; }
      #drop { border: 2px dashed #aaa; border-radius: 8px; padding: 10px 14px; }
    </style>
  </head>
  <body>
    <h1>Cutout test bench</h1>
    <p>
      Left: the photo. Right: what the app cuts out (on a dark checkerboard so halos and holes show).
      Real photos dropped in <code>test-photos/</code> appear at the top. You can also drop photos onto this page.
    </p>
    <div class="controls">
      <label>Strong ink <input id="high" type="range" min="0.1" max="0.5" step="0.01" /><output></output></label>
      <label>Faint ink <input id="low" type="range" min="0.03" max="0.3" step="0.01" /><output></output></label>
      <label>Gap closing <input id="close" type="range" min="1" max="8" step="1" /><output></output></label>
      <label id="drop">Add photos <input id="files" type="file" accept="image/*" multiple /></label>
    </div>
    <div id="rows"></div>
    <script type="module" src="/src/dev/cutoutTest.ts"></script>
  </body>
</html>
