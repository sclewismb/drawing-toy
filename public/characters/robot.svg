<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360">
  <g stroke="#222" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter">
    <!-- tilted antenna (one side, so flipping is visible) -->
    <path d="M170 60 L210 14" fill="none"/>
    <rect x="198" y="2" width="24" height="24" fill="#ff5d5d"/>
    <!-- legs -->
    <rect x="95" y="290" width="40" height="60" fill="#5b6b7a"/>
    <rect x="165" y="290" width="40" height="60" fill="#5b6b7a"/>
    <!-- arms -->
    <rect x="30" y="180" width="40" height="90" fill="#4ecdc4"/>
    <rect x="230" y="150" width="40" height="40" fill="#4ecdc4"/>
    <rect x="255" y="110" width="40" height="40" fill="#4ecdc4"/>
    <!-- body -->
    <rect x="70" y="170" width="160" height="125" fill="#4ecdc4"/>
    <rect x="100" y="200" width="30" height="30" fill="#ffd93d"/>
    <rect x="140" y="200" width="30" height="30" fill="#ff5d5d"/>
    <rect x="180" y="200" width="20" height="30" fill="#7bd36b"/>
    <!-- head -->
    <rect x="80" y="60" width="140" height="110" fill="#9fb3c4"/>
    <rect x="102" y="88" width="34" height="34" fill="#fff"/>
    <rect x="164" y="88" width="34" height="34" fill="#fff"/>
    <rect x="114" y="100" width="14" height="14" fill="#222" stroke="none"/>
    <rect x="176" y="100" width="14" height="14" fill="#222" stroke="none"/>
    <path d="M115 145 L135 152 L165 152 L185 145" fill="none" stroke-width="6"/>
  </g>
</svg>
